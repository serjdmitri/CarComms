name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (standard library only)
        run: python -m unittest discover -s tests -t . -v
      - name: Experiment smoke run
        run: python -m carcomms experiment --trials 100
      - name: Results in docs/ are reproducible
        run: |
          python -m carcomms experiment --out /tmp/results >/dev/null
          diff -u docs/results/results.md /tmp/results/results.md
