<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Two small cars approach a four-way intersection; one is granted the crossing first.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
  </defs>
  <style>text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}</style>
  <rect width="900" height="240" rx="16" fill="url(#g)"/>
  <!-- intersection -->
  <g transform="translate(690 120)">
    <rect x="-34" y="-110" width="68" height="220" fill="#334155"/>
    <rect x="-200" y="-34" width="400" height="68" fill="#334155"/>
    <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8"><path d="M0 -110V-34M0 34V110M-200 0H-34M34 0H200"/></g>
    <rect x="-34" y="-36" width="68" height="3" fill="#f43f5e"/><rect x="-34" y="33" width="68" height="3" fill="#f43f5e"/>
    <rect x="-36" y="-34" width="3" height="68" fill="#f43f5e"/><rect x="33" y="-34" width="3" height="68" fill="#f43f5e"/>
    <!-- car A waits -->
    <rect x="-78" y="-12" width="34" height="22" rx="6" fill="#f59e0b"/><text x="-61" y="4" font-size="11" font-weight="700" text-anchor="middle" fill="#111827">A</text>
    <!-- car B crosses -->
    <rect x="-12" y="38" width="22" height="34" rx="6" fill="#34d399"/><text x="-1" y="60" font-size="11" font-weight="700" text-anchor="middle" fill="#111827">B</text>
    <path d="M-1 30 V-20" stroke="#34d399" stroke-width="3" stroke-dasharray="4 5"/>
  </g>
  <text x="40" y="92" font-size="46" font-weight="800" fill="#ffffff">CarComms</text>
  <text x="40" y="128" font-size="18" fill="#cbd5e1">Two small cars agree who crosses first.</text>
  <text x="40" y="154" font-size="14" fill="#94a3b8">Priority-aware intersection coordination for Raspberry Pi robots.</text>
  <text x="40" y="196" font-size="13" fill="#fbbf24">Prototype: simulated and tested in software. Not yet run on the real cars.</text>
</svg>
